    RiskPreviewResult: {"type":"object","additionalProperties":false,"required":["technical_impact","known_impact_floor","evidence_completeness","review_priority","total_items","known_items","unknown_items","distinct_known_categories","findings"],"properties":{"technical_impact":{"type":"string","enum":["unknown","low","medium","high"],"readOnly":true},"known_impact_floor":{"type":["string","null"],"enum":["low","medium","high",null],"readOnly":true},"evidence_completeness":{"type":"string","enum":["complete","partial"],"readOnly":true},"review_priority":{"type":"string","enum":["normal","elevated","urgent"],"readOnly":true},"total_items":{"type":"integer","minimum":0,"readOnly":true},"known_items":{"type":"integer","minimum":0,"readOnly":true},"unknown_items":{"type":"integer","minimum":0,"readOnly":true},"distinct_known_categories":{"type":"integer","minimum":0,"readOnly":true},"findings":{"type":"array","maxItems":10016,"items":{"$ref":"#/components/schemas/RiskFinding"},"readOnly":true}}}
