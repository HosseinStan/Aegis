openapi: 3.1.0
info:
  title: Aegis API
  version: 1.0.0
  description: >-
    Internal, read-only network configuration and device management API. The
    API never accepts arbitrary device commands or unregistered target hosts.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Configuration
  - name: Backups
  - name: Credentials
  - name: Audit
  - name: Change Policies
  - name: Change Risk
paths:
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessment/preview:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    post:
      tags: [Change Risk]
      summary: Preview live potential impact and human review priority
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Live, unrecorded metadata-only preview. historical=false. No evidence or registry writes. UNKNOWN is not LOW; completeness is limited to the model contract. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      requestBody:
        required: false
        description: Empty body or one strict JSON object, at most 4096 bytes including whitespace. Nonempty bodies require application/json (UTF-8). Duplicate, unknown, trailing keys/values and caller evidence/result/actor/impact/priority are rejected.
        content: {application/json: {schema: {$ref: '#/components/schemas/RiskPreviewRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/RiskPreviewResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
        '415': {$ref: '#/components/responses/RiskUnsupportedMediaType'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessment:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    post:
      tags: [Change Risk]
      summary: Record an immutable assessment or verify a retry
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Additionally requires changes.risk.evaluate AND changes.risk.read, including verified retries. Missing/null expectation creates R1 only when no latest exists; may retry an unchanged R1. Exact latest ID is required for changed evidence. Unchanged latest permits latest or immediate-predecessor expectation (verified lost-response retry). Other expectations conflict. 201/200 require confirmed COMMIT and a fresh atomic change_risk.evaluate audit; audit failure is non-2xx. No automatic cached retry or caller result. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      requestBody:
        required: false
        description: Empty body or one strict JSON object, at most 4096 bytes including whitespace. Nonempty bodies require application/json (UTF-8). Duplicate, unknown, trailing keys/values and caller evidence/result/actor/impact/priority are rejected.
        content: {application/json: {schema: {$ref: '#/components/schemas/RiskAssessmentRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/RiskRecordResponse'}
        '201': {$ref: '#/components/responses/RiskRecordResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
        '415': {$ref: '#/components/responses/RiskUnsupportedMediaType'}
    get:
      tags: [Change Risk]
      summary: Read latest recorded historical assessment
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Latest recorded is historical=true, NOT current governance or a live security assurance. Replayed and live-authorized, never rescored. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      responses:
        '200': {$ref: '#/components/responses/RiskAssessmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessment/findings:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    get:
      tags: [Change Risk]
      summary: Page findings of a pinned latest historical assessment
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Resolves latest once in the same snapshot; meta.assessment_id pins the record. Continue with revision-specific findings when latest changes. Ordinal ASC. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      parameters:
        - {$ref: '#/components/parameters/RiskLimit'}
        - {$ref: '#/components/parameters/RiskOffset'}
      responses:
        '200': {$ref: '#/components/responses/RiskFindingsResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessments:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    get:
      tags: [Change Risk]
      summary: Page recorded historical revisions
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Replayed historical summaries in revision DESC order, not current rescoring. Only limit/offset query parameters are accepted; no filters. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      parameters:
        - {$ref: '#/components/parameters/RiskLimit'}
        - {$ref: '#/components/parameters/RiskOffset'}
      responses:
        '200': {$ref: '#/components/responses/RiskHistoryResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessments/{assessmentID}:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
      - {$ref: '#/components/parameters/RiskAssessmentID'}
    get:
      tags: [Change Risk]
      summary: Read exact scoped historical revision
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Historical=true. Foreign assessment/event/device IDs are scoped missing resources, not cross-device evidence. Full historical replay required. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      responses:
        '200': {$ref: '#/components/responses/RiskAssessmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/risk-assessments/{assessmentID}/findings:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
      - {$ref: '#/components/parameters/RiskAssessmentID'}
    get:
      tags: [Change Risk]
      summary: Page exact historical revision findings
      description: >-
        Every operation requires live devices.read, backups.read, changes.authorization.read, changes.policy.read, changes.risk.read and current device-group access, plus an enabled actor. Middleware is supplementary to same-transaction backend checks. Historical=true; stable ordinal ASC paging and meta.assessment_id. Foreign assessment IDs return scoped 404. No source configuration, commands, context paths, binding sidecars or secret material is returned. Potential impact is advisory, never approval or full-device security.
      parameters:
        - {$ref: '#/components/parameters/RiskLimit'}
        - {$ref: '#/components/parameters/RiskOffset'}
      responses:
        '200': {$ref: '#/components/responses/RiskFindingsResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RiskConflict'}
        '500': {$ref: '#/components/responses/RiskIntegrity'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
  /api/v1/devices/{deviceID}/change-policies:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    post:
      tags: [Change Policies]
      summary: Create an immutable draft policy
      description: Requires devices.read and changes.policy.manage and current device-group access. Definition is immutable from creation; no default or automatic activation.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicySetCreate'}}}
      responses:
        '201': {$ref: '#/components/responses/PolicySetResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Change Policies]
      summary: List device-scoped policies
      description: Requires devices.read and changes.policy.read and current device-group access. Returns draft, active and retired definitions without configuration material.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {in: query, name: status, schema: {type: string, enum: [draft, active, retired]}}
        - {in: query, name: config_type, schema: {type: string, enum: [running, startup]}}
      responses:
        '200': {$ref: '#/components/responses/PolicySetListResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-policies/{policyID}:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/PolicyID'}
    get:
      tags: [Change Policies]
      summary: Read an immutable policy definition
      description: Requires devices.read and changes.policy.read and current device-group access. Cross-device IDs return not found.
      responses:
        '200': {$ref: '#/components/responses/PolicySetResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/devices/{deviceID}/change-policies/{policyID}/activate:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/PolicyID'}
    post:
      tags: [Change Policies]
      summary: Activate a validated draft policy
      description: Requires devices.read and changes.policy.manage and current device-group access. Only draft to active; exactly one active policy per device/config type. Server records actor and activation time. Activation cannot retroactively evaluate older observations.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEmptyAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/PolicySetResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-policies/{policyID}/retire:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/PolicyID'}
    post:
      tags: [Change Policies]
      summary: Retire an active policy
      description: Requires devices.read and changes.policy.manage and current device-group access. Only active to retired; retirement prevents new evaluations but preserves all historical snapshots and outcomes. No restore, edit or delete operation.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEmptyAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/PolicySetResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/policy-evaluation/preview:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    post:
      tags: [Change Policies]
      summary: Preview policy evaluation without persistence
      description: Requires devices.read, backups.read and changes.policy.evaluate and current device-group access. Repeatable read-only preview, including already-evaluated events; existing_evaluation identifies immutable final evidence. Does not change event status or technical history. Only current active policy activated no later than DetectedAt is eligible. DetectedAt is observation time, not proof of command execution time. Invalid/corrupt evidence fails closed.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEmptyAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/PolicyPreviewResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/policy-evaluation:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    post:
      tags: [Change Policies]
      summary: Explicitly persist one final policy evaluation
      description: Requires devices.read, backups.read and changes.policy.evaluate and current device-group access. Server selects active policy and rechecks actor, sanitized classified evidence, definition hash and ActivatedAt <= DetectedAt in one write transaction. Exactly one final evaluation per event; repeat conflicts. pass requires nonempty valid evidence and every item explicitly allowed with no denied or uncovered items. Any explicit deny yields violation, retaining uncovered counts. Uncovered-only, absent policy, zero-item and legacy results are not_evaluated and cannot persist. Atomic evidence and policy_status update; authorization_status and authorization history are independent. PASS means only these observed items were allowed, not device security, CIS compliance, authorization or zero risk.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEmptyAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/PolicyEvaluationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Change Policies]
      summary: Read immutable final evaluation evidence
      description: Requires devices.read, backups.read and changes.policy.read and current device-group access. Snapshot and hash describe the exact evaluated definition even after retirement. No raw commands or configuration are copied into evidence.
      responses:
        '200': {$ref: '#/components/responses/PolicyEvaluationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/policy-evaluation/items:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/EventID'}
    get:
      tags: [Change Policies]
      summary: Read ordered immutable per-item policy evidence
      description: Requires devices.read, backups.read and changes.policy.read and current device-group access. Paged ordinal order; contains IDs, category/operation, decision and derived rule key only, never Command or ContextPath copies.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {$ref: '#/components/responses/PolicyEvaluationItemsResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /healthz:
    get:
      summary: Process liveness
      security: []
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /readyz:
    get:
      summary: Database readiness
      security: []
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '500': {description: Dependency unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /metrics:
    get:
      summary: Prometheus metrics
      description: Requires `system.manage` and should be network-restricted.
      responses:
        '200': {description: Prometheus exposition text, content: {text/plain: {schema: {type: string}}}}
  /api/openapi.yaml:
    get:
      summary: Canonical OpenAPI contract
      responses:
        '200': {description: OpenAPI YAML, content: {application/yaml: {schema: {type: string}}}}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a local development user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End a client session
      responses:
        '204': {description: Session ended}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated principal
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/auth/docs-session:
    post:
      tags: [Authentication]
      summary: Create a short-lived HTTP-only Swagger UI session
      responses:
        '204': {description: Documentation cookie created}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/credentials:
    get:
      tags: [Credentials]
      summary: List credential metadata
      description: Requires `credentials.manage`. Secret values are never returned.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Credentials]
      summary: Create an encrypted device credential
      description: Requires `credentials.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialCreate'}
      responses:
        '201': {$ref: '#/components/responses/DataResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/credentials/{credentialID}:
    delete:
      tags: [Credentials]
      summary: Delete an unused credential
      description: Requires `credentials.manage`.
      parameters: [{$ref: '#/components/parameters/CredentialID'}]
      responses:
        '204': {description: Credential deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List devices visible to the principal
      description: Requires `devices.read`; device-group restrictions are applied.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: group, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Devices]
      summary: Register an approved device
      description: Requires `devices.manage`. The management target must be an IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceCreate'}
      responses:
        '201': {$ref: '#/components/responses/DeviceResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      tags: [Devices]
      summary: Get an approved device
      responses:
        '200': {$ref: '#/components/responses/DeviceResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Devices]
      summary: Update an approved device
      description: Requires `devices.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevicePatch'}
      responses:
        '200': {$ref: '#/components/responses/DeviceResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Devices]
      summary: Delete a device without retained backups
      description: Requires `devices.manage`.
      responses:
        '204': {description: Device deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/test-connection:
    post:
      tags: [Devices]
      summary: Test the registered connector
      description: Requires `devices.manage`. No user-supplied command is accepted.
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
        '504': {$ref: '#/components/responses/Timeout'}
  /api/v1/devices/{deviceID}/config/running:
    get:
      tags: [Configuration]
      summary: Read the running configuration
      description: Requires `configs.read`. `refresh=true` additionally requires `devices.manage`.
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Refresh'}]
      responses:
        '200': {$ref: '#/components/responses/ConfigResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
        '504': {$ref: '#/components/responses/Timeout'}
  /api/v1/devices/{deviceID}/config/startup:
    get:
      tags: [Configuration]
      summary: Read the startup configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Refresh'}]
      responses:
        '200': {$ref: '#/components/responses/ConfigResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
  /api/v1/devices/{deviceID}/config/running/download:
    get:
      tags: [Configuration]
      summary: Download the running configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200':
          description: Configuration text
          content: {text/plain: {schema: {type: string}}}
  /api/v1/devices/{deviceID}/config/startup/download:
    get:
      tags: [Configuration]
      summary: Download the startup configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200':
          description: Configuration text
          content: {text/plain: {schema: {type: string}}}
  /api/v1/devices/{deviceID}/facts:
    get:
      tags: [Configuration]
      summary: Read device facts
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/devices/{deviceID}/interfaces:
    get:
      tags: [Configuration]
      summary: Read interface status
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/devices/{deviceID}/backups:
    get:
      tags: [Backups]
      summary: List configuration backups
      description: Requires `backups.read`.
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
    post:
      tags: [Backups]
      summary: Create a manual configuration backup
      description: Requires `backups.create`. Identical content is deduplicated.
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config_type: {type: string, enum: [running, startup], default: running}
      responses:
        '201': {$ref: '#/components/responses/DataResponse'}
        '200': {description: Existing identical backup, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /api/v1/devices/{deviceID}/backups/{backupID}:
    get:
      tags: [Backups]
      summary: Get backup metadata and content
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/BackupID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/backups/{backupID}/download:
    get:
      tags: [Backups]
      summary: Download a retained backup
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/BackupID'}]
      responses:
        '200': {description: Configuration text, content: {text/plain: {schema: {type: string}}}}
  /api/v1/devices/{deviceID}/backups/{leftID}/diff/{rightID}:
    get:
      tags: [Backups]
      summary: Compare two backups
      parameters:
        - {$ref: '#/components/parameters/DeviceID'}
        - {name: leftID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: rightID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit records
      description: Requires `audit.read`. Audit records never contain credentials or configuration content.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
  /api/v1/audit-logs/{auditID}:
    get:
      tags: [Audit]
      summary: Get an audit record
      parameters:
        - {name: auditID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-authorizations:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      summary: List device-scoped authorization requests
      description: Requires devices.read + changes.authorization.read and device-group access.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, revoked]}}
        - {name: config_type, in: query, schema: {type: string, enum: [running, startup]}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationListResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Register an explicit scoped authorization request
      description: >-
        Requires devices.read + changes.authorization.request and device-group access.
        Device comes only from the route. Actor and lifecycle timestamps come from the server.
        Reference is trimmed and uppercased and unique case-insensitively.
        Categories are trimmed/lowercased, distinct, known version-one categories, and stored sorted.
        No edits are available; changed scope requires a new request.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangeAuthorizationCreate'}}}
      responses:
        '201': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    get:
      summary: Inspect an authorization request
      description: Requires devices.read + changes.authorization.read and device-group access. Cross-device IDs return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/approve:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Independently approve a pending request
      description: >-
        Requires devices.read + changes.authorization.approve and device-group access.
        Only pending -> approved, before window_end. Active approver must differ from requester,
        including system administrators. Server UTC time and authenticated actor are recorded.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/reject:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Reject a pending request
      description: Requires devices.read + changes.authorization.approve and device-group access. Only pending -> rejected; terminal and immutable decision.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/revoke:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Revoke an approved request
      description: >-
        Requires devices.read + changes.authorization.approve and device-group access.
        Only approved -> revoked; terminal. New links are prohibited. Prior valid links and
        event authorization remain intact as-of the recorded historical decision. Policy is unchanged.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/history:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    get:
      summary: Read immutable authorization history
      description: Requires devices.read + changes.authorization.read and device-group access. Append-only; no edit/delete endpoint or raw configuration payload.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationHistoryResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      summary: Inspect device change events without backup contents
      description: Requires devices.read + backups.read and device-group access. No automatic authorization or policy evaluation occurs.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: config_type, in: query, schema: {type: string, enum: [running, startup]}}
        - {name: authorization_status, in: query, schema: {type: string, enum: [unaccounted, authorized]}}
        - {name: policy_status, in: query, schema: {type: string, enum: [not_evaluated, pass, violation]}}
      responses:
        '200': {$ref: '#/components/responses/ChangeEventListResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect a scoped change event
      description: Requires devices.read + backups.read and device-group access. Cross-device IDs return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeEventResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/items:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect sanitized classified change items
      description: Requires devices.read + backups.read and device-group access. Ordinal ascending; only sanitized Command/ContextPath, never raw backup or diff.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ChangeEventItemsResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/authorize:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    post:
      summary: Explicitly attest and reconcile one observed change event
      description: >-
        Requires devices.read + backups.read + changes.authorization.reconcile and device-group access.
        Active reviewer must differ from requester; independent approver may reconcile.
        Request must currently be approved with independent approval issued at or before DetectedAt.
        Event must be unaccounted, match device/config type, have a valid snapshot chain,
        analysis version 1 and nonzero items with matching count. Every item must have valid
        classification version 1 and an explicitly allowed category. Other is not a wildcard;
        subcategory unclassified is not a wildcard. Inclusive window_start <= DetectedAt < exclusive window_end.
        One request links at most one event and one event links at most one request.
        Duplicate attempts conflict. Link, event status/UpdatedAt and history commit atomically.
        DetectedAt is Aegis observation time, not exact physical device command execution time.
        This is a human attestation supported by checks, not cryptographic proof. No partial authorization.
        Legacy/zero-item events cannot be authorized. PolicyStatus is untouched.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangeEventAuthorize'}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeEventAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/authorization:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect recorded event-to-ticket authorization evidence
      description: Requires devices.read + changes.authorization.read and device-group access. Historical evidence survives later revocation; unlinked events return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeEventAuthorizationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
