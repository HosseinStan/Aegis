    RiskAssessmentEnvelope: {"type":"object","additionalProperties":false,"required":["data","meta"],"properties":{"data":{"$ref":"#/components/schemas/RiskAssessment"},"meta":{"$ref":"#/components/schemas/RiskMeta"}}}
    RiskHistoryEnvelope: {"type":"object","additionalProperties":false,"required":["data","meta"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/RiskAssessment"}},"meta":{"$ref":"#/components/schemas/RiskMeta"}}}
    RiskFindingsEnvelope: {"type":"object","additionalProperties":false,"required":["data","meta"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/RiskFinding"}},"meta":{"$ref":"#/components/schemas/RiskMeta"}}}
    PolicyEmptyAction:
      type: object
      additionalProperties: false
      description: Empty body or empty object only. Policy ID, outcome, hash, actor and timestamps are never accepted.
    PolicyCategory:
      type: string
      enum: [system, interface, switching, routing, access_control, aaa, management, monitoring, services, crypto_vpn, qos, redundancy, other]
      description: Existing deterministic classification taxonomy. other is explicit, never a wildcard. unclassified is unsupported.
    PolicyRule:
      type: object
      additionalProperties: false
      required: [category, operation, decision]
      properties:
        category: {$ref: '#/components/schemas/PolicyCategory'}
        operation: {type: string, enum: [add, remove]}
        decision: {type: string, enum: [allow, deny]}
    PolicySetCreate:
      type: object
      additionalProperties: false
      required: [reference, config_type, rules]
      description: Reference trimmed/ASCII uppercase, globally case-insensitive unique. Categories trimmed/lowercase. Operations and decisions must be exact lowercase. Duplicate/conflicting category-operation tuples rejected. Rules sorted category then operation; server derives policy.category.operation keys.
      properties:
        reference: {type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$'}
        config_type: {type: string, enum: [running, startup]}
        rules: {type: array, minItems: 1, maxItems: 26, items: {$ref: '#/components/schemas/PolicyRule'}}
    PolicyDefinition:
      type: object
      additionalProperties: false
      required: [engine_version, device_id, config_type, rules]
      description: Canonical compact JSON in this field order, rules sorted category then operation. SHA-256 lowercase hex includes scope/version/rules/decisions, excludes identity/lifecycle/user/times. Integrity and reproducibility, not protection against a malicious database administrator.
      properties:
        engine_version: {type: integer, const: 1}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        rules: {type: array, minItems: 1, maxItems: 26, items: {$ref: '#/components/schemas/PolicyRule'}}
    PolicySet:
      type: object
      required: [id, reference, device_id, config_type, status, engine_version, rules, definition_hash, created_by, created_at, updated_at]
      description: Immutable definition; draft to active to retired only. Operator read, network administrator read/evaluate, system administrator read/manage/evaluate; viewer has no policy grants.
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        status: {type: string, enum: [draft, active, retired]}
        engine_version: {type: integer, const: 1}
        rules: {type: array, items: {$ref: '#/components/schemas/PolicyRule'}}
        definition_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        activated_by: {type: string, format: uuid}
        activated_at: {type: string, format: date-time}
        retired_by: {type: string, format: uuid}
        retired_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PolicyItemResult:
      type: object
      required: [item_id, ordinal, category, operation, decision, matched_rule_key]
      properties:
        item_id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 0}
        category: {$ref: '#/components/schemas/PolicyCategory'}
        operation: {type: string, enum: [add, remove]}
        decision: {type: string, enum: [allow, deny, uncovered]}
        matched_rule_key: {type: string, description: Derived policy.category.operation for matched items; empty for uncovered.}
    PolicyEvaluationPreview:
      type: object
      required: [event_id, outcome, item_results, total_items, allowed_count, denied_count, uncovered_count]
      properties:
        event_id: {type: string, format: uuid}
        policy_set_id: {type: string, format: uuid}
        policy_definition_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        outcome: {type: string, enum: [not_evaluated, pass, violation]}
        reason: {type: string, enum: [no_active_policy, uncovered_items, legacy_classification, invalid_evidence]}
        item_results: {type: array, items: {$ref: '#/components/schemas/PolicyItemResult'}}
        total_items: {type: integer, minimum: 0}
        allowed_count: {type: integer, minimum: 0}
        denied_count: {type: integer, minimum: 0}
        uncovered_count: {type: integer, minimum: 0}
        existing_evaluation: {$ref: '#/components/schemas/ChangePolicyEvaluation'}
    ChangePolicyEvaluation:
      type: object
      required: [id, event_id, policy_set_id, engine_version, policy_definition_hash, policy_definition_snapshot, result, total_items, allowed_count, denied_count, uncovered_count, evaluated_by, evaluated_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        policy_set_id: {type: string, format: uuid}
        engine_version: {type: integer, const: 1}
        policy_definition_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        policy_definition_snapshot: {type: string, description: Exact compact canonical JSON PolicyDefinition used in this immutable final evaluation.}
        result: {type: string, enum: [pass, violation]}
        total_items: {type: integer, minimum: 1}
        allowed_count: {type: integer, minimum: 0}
        denied_count: {type: integer, minimum: 0}
        uncovered_count: {type: integer, minimum: 0}
        evaluated_by: {type: string, format: uuid}
        evaluated_at: {type: string, format: date-time}
    ChangePolicyEvaluationItem:
      type: object
      required: [evaluation_id, event_id, change_event_item_id, ordinal, category, operation, decision, matched_rule_key]
      properties:
        evaluation_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        change_event_item_id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 0}
        category: {$ref: '#/components/schemas/PolicyCategory'}
        operation: {type: string, enum: [add, remove]}
        decision: {type: string, enum: [allow, deny, uncovered]}
        matched_rule_key: {type: string}
    ChangeAuthorizationCreate:
      type: object
      additionalProperties: false
      required: [reference, config_type, allowed_categories, window_start, window_end]
      properties:
        reference: {type: string, description: 'Trimmed/uppercase normalized ASCII letters, digits, dots, underscores, colons and hyphens; normalized length 3-64. No secrets or raw configuration.'}
        config_type: {type: string, enum: [running, startup]}
        allowed_categories:
          type: array
          minItems: 1
          maxItems: 13
          uniqueItems: true
          description: Normalized lowercase/trimmed, no duplicates after normalization. Other must be explicitly included; unclassified is forbidden.
          items: {$ref: '#/components/schemas/ChangeAuthorizationCategory'}
        window_start: {type: string, format: date-time, description: 'Explicit RFC3339 timezone required; normalized UTC, inclusive start.'}
        window_end: {type: string, format: date-time, description: 'Explicit RFC3339 timezone required; normalized UTC, exclusive end. Start < end, maximum duration 24 hours. End must be after server time at creation/approval.'}
    ChangeAuthorizationCategory:
      type: string
      enum: [system, interface, switching, routing, access_control, aaa, management, monitoring, services, crypto_vpn, qos, redundancy, other]
    AuthorizationAction:
      type: object
      additionalProperties: false
      description: Empty object or no body. Client actor/timestamp fields are rejected.
    ChangeEventAuthorize:
      type: object
      additionalProperties: false
      required: [authorization_id, attestation]
      properties:
        authorization_id: {type: string, format: uuid}
        attestation: {type: string, enum: [reviewed_change_items_against_ticket]}
    ChangeAuthorization:
      type: object
      required: [id, reference, device_id, config_type, allowed_categories, window_start, window_end, status, requested_by, requested_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z0-9._:-]+$'}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        allowed_categories: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorizationCategory'}, minItems: 1, maxItems: 13, uniqueItems: true}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        status: {type: string, enum: [pending, approved, rejected, revoked]}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
        rejected_by: {type: string, format: uuid}
        rejected_at: {type: string, format: date-time}
        revoked_by: {type: string, format: uuid}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChangeEventAuthorization:
      type: object
      required: [event_id, authorization_id, linked_by, linked_at, attestation]
      properties:
        event_id: {type: string, format: uuid}
        authorization_id: {type: string, format: uuid}
        linked_by: {type: string, format: uuid}
        linked_at: {type: string, format: date-time}
        attestation: {type: string, enum: [reviewed_change_items_against_ticket]}
    ChangeAuthorizationHistory:
      type: object
      required: [id, authorization_id, action, actor_user_id, occurred_at]
      properties:
        id: {type: string, format: uuid}
        authorization_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        action: {type: string, enum: [requested, approved, rejected, revoked, linked]}
        actor_user_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    ChangeEvent:
      type: object
      required: [id, device_id, config_type, from_backup_id, to_backup_id, detected_at, added_lines, removed_lines, authorization_status, policy_status, created_at, updated_at, analysis_version, item_count]
      properties:
        id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        from_backup_id: {type: string, format: uuid}
        to_backup_id: {type: string, format: uuid}
        detected_at: {type: string, format: date-time, description: 'Aegis observation timestamp, not exact device command execution time.'}
        added_lines: {type: integer, minimum: 0}
        removed_lines: {type: integer, minimum: 0}
        authorization_status: {type: string, enum: [unaccounted, authorized]}
        policy_status: {type: string, enum: [not_evaluated, pass, violation]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        analysis_version: {type: integer, minimum: 0}
        analyzed_at: {type: string, format: date-time}
        item_count: {type: integer, minimum: 0}
    ChangeEventItem:
      type: object
      required: [id, change_event_id, ordinal, operation, context_path, command, sensitive, created_at, classification_version, category, subcategory, classification_rule]
      properties:
        id: {type: string, format: uuid}
        change_event_id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 0}
        operation: {type: string, enum: [add, remove]}
        context_path: {type: array, items: {type: string}, description: Sanitized context only.}
        command: {type: string, description: Sanitized command only.}
        sensitive: {type: boolean}
        created_at: {type: string, format: date-time}
        classification_version: {type: integer, minimum: 0}
        category: {type: string}
        subcategory: {type: string}
        classification_rule: {type: string}
        classified_at: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    TokenSet:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [name, auth_type, username]
      properties:
        name: {type: string}
        auth_type: {type: string, enum: [password, private_key]}
        username: {type: string}
        password: {type: string, format: password}
        private_key: {type: string, writeOnly: true}
        enable_secret: {type: string, format: password, writeOnly: true}
    DeviceWrite:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, maxLength: 200}
        hostname: {type: string, maxLength: 253}
        management_ip: {type: string, format: ip}
        management_port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        vendor: {type: string, enum: [cisco]}
        platform: {type: string, enum: [ios, ios-xe]}
        protocol: {type: string, enum: [ssh]}
        credential_id: {type: string, format: uuid}
        device_group: {type: string}
        description: {type: string}
        enabled: {type: boolean}
    DeviceCreate:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          required: [display_name, management_ip, vendor, platform, protocol, credential_id]
    DevicePatch:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          minProperties: 1
    Device:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          required: [id, display_name, management_ip, management_port, vendor, platform, protocol, enabled, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            last_success_at: {type: string, format: date-time}
            last_failure_at: {type: string, format: date-time}
            last_error_code: {type: string}
    ConfigResult:
      type: object
      required: [device_id, vendor, platform, protocol, configuration_type, retrieved_at, from_cache, content_hash, config]
      properties:
        device_id: {type: string, format: uuid}
        hostname: {type: string}
        vendor: {type: string}
        platform: {type: string}
        protocol: {type: string}
        configuration_type: {type: string, enum: [running, startup]}
        retrieved_at: {type: string, format: date-time}
        from_cache: {type: boolean}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        config: {type: string}
    DataEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, format: uuid}
        pagination:
          type: object
          properties: {limit: {type: integer}, offset: {type: integer}, total: {type: integer}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: DEVICE_CONNECTION_FAILED}
            message: {type: string}
            request_id: {type: string, format: uuid}
  responses:
    RiskPreviewResponse: {"description":"Verified live, unrecorded metadata-only preview","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RiskPreviewEnvelope"}}}}
    RiskRecordResponse: {"description":"Confirmed creation (201) or verified retry (200), including a fresh atomic action audit","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RiskRecordEnvelope"}}}}
    RiskAssessmentResponse: {"description":"Verified recorded historical assessment, not current governance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RiskAssessmentEnvelope"}}}}
    RiskHistoryResponse: {"description":"Verified historical revision summaries in revision DESC order","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RiskHistoryEnvelope"}}}}
    RiskFindingsResponse: {"description":"Verified ordinal findings with pinned assessment ID","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RiskFindingsEnvelope"}}}}
    RiskConflict: {"description":"Stale CAS (CONFLICT), unsupported evidence (RISK_EVIDENCE_UNSUPPORTED), or assessment limit (RISK_ASSESSMENT_LIMIT). No new committed evidence.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
    RiskIntegrity: {"description":"RISK_INTEGRITY_FAILURE: corrupt source or historical evidence. No SQL or source diagnostics.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
    RiskUnavailable: {"description":"With a live parent request: HTTP 503 JSON RISK_UNAVAILABLE for database busy/unsafe/unavailable, required audit failure, service-side cancellation/deadline or bounded admission overload. The existing global server deadline instead returns HTTP 503 JSON COMMAND_TIMEOUT. A genuinely canceled client/parent transport cannot be guaranteed a JSON body; Go http.TimeoutHandler may return 503 with no body only in that canceled-context case. This exception does not apply to live-request service unavailability. No successful result is asserted.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
    RiskUnsupportedMediaType: {"description":"HTTP 415 UNSUPPORTED_MEDIA_TYPE: Unsupported request content type. The existing text/plain guard rejects before risk handlers. Exact scoped risk POSTs use the standard safe JSON Error envelope and server request_id; never echo request body or raw media type. Other strict-decoder validation remains HTTP 400.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"example":{"error":{"code":"UNSUPPORTED_MEDIA_TYPE","message":"Unsupported request content type.","request_id":"11111111-1111-4111-8111-111111111111"}}}}}
    PolicySetResponse: {description: Immutable scoped policy definition and lifecycle, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/PolicySet'}}}]}}}}
    PolicySetListResponse: {description: Paginated scoped immutable policies, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PolicySet'}}}}]}}}}
    PolicyPreviewResponse: {description: Read-only deterministic preview and existing final evidence if any, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/PolicyEvaluationPreview'}}}]}}}}
    PolicyEvaluationResponse: {description: Immutable final policy evaluation, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangePolicyEvaluation'}}}]}}}}
    PolicyEvaluationItemsResponse: {description: Paginated ordinal-ordered immutable item decisions, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangePolicyEvaluationItem'}}}}]}}}}
    ChangeAuthorizationResponse: {description: Scoped authorization request, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeAuthorization'}}}]}}}}
    ChangeAuthorizationListResponse: {description: Paginated scoped authorization requests, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorization'}}}}]}}}}
    ChangeEventResponse: {description: Scoped change event without raw configuration, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeEvent'}}}]}}}}
    ChangeEventListResponse: {description: Paginated scoped change events, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeEvent'}}}}]}}}}
    ChangeEventItemsResponse: {description: Paginated sanitized items in ordinal order, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeEventItem'}}}}]}}}}
    ChangeEventAuthorizationResponse: {description: Immutable recorded authorization link, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeEventAuthorization'}}}]}}}}
    ChangeAuthorizationHistoryResponse: {description: Paginated append-only history ordered by action time then insertion order, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorizationHistory'}}}}]}}}}
    DataResponse: {description: Successful response, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    ListResponse: {description: Paginated response, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    DeviceResponse: {description: Device, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Device'}}}]}}}}
    ConfigResponse: {description: Configuration, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ConfigResult'}}}]}}}}
    AuthResponse: {description: Tokens issued, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationFailed: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    DeviceFailure: {description: Safe connector failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Timeout: {description: Device operation timed out, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
