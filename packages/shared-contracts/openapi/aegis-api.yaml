openapi: 3.1.0
info:
  title: Aegis API
  version: 1.0.0
  description: >-
    Internal, read-only network configuration and device management API. The
    API never accepts arbitrary device commands or unregistered target hosts.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Configuration
  - name: Backups
  - name: Credentials
  - name: Audit
paths:
  /healthz:
    get:
      summary: Process liveness
      security: []
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /readyz:
    get:
      summary: Database readiness
      security: []
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '500': {description: Dependency unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /metrics:
    get:
      summary: Prometheus metrics
      description: Requires `system.manage` and should be network-restricted.
      responses:
        '200': {description: Prometheus exposition text, content: {text/plain: {schema: {type: string}}}}
  /api/openapi.yaml:
    get:
      summary: Canonical OpenAPI contract
      responses:
        '200': {description: OpenAPI YAML, content: {application/yaml: {schema: {type: string}}}}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a local development user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End a client session
      responses:
        '204': {description: Session ended}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated principal
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/auth/docs-session:
    post:
      tags: [Authentication]
      summary: Create a short-lived HTTP-only Swagger UI session
      responses:
        '204': {description: Documentation cookie created}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/credentials:
    get:
      tags: [Credentials]
      summary: List credential metadata
      description: Requires `credentials.manage`. Secret values are never returned.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Credentials]
      summary: Create an encrypted device credential
      description: Requires `credentials.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialCreate'}
      responses:
        '201': {$ref: '#/components/responses/DataResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/credentials/{credentialID}:
    delete:
      tags: [Credentials]
      summary: Delete an unused credential
      description: Requires `credentials.manage`.
      parameters: [{$ref: '#/components/parameters/CredentialID'}]
      responses:
        '204': {description: Credential deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List devices visible to the principal
      description: Requires `devices.read`; device-group restrictions are applied.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: group, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Devices]
      summary: Register an approved device
      description: Requires `devices.manage`. The management target must be an IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceCreate'}
      responses:
        '201': {$ref: '#/components/responses/DeviceResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      tags: [Devices]
      summary: Get an approved device
      responses:
        '200': {$ref: '#/components/responses/DeviceResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Devices]
      summary: Update an approved device
      description: Requires `devices.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevicePatch'}
      responses:
        '200': {$ref: '#/components/responses/DeviceResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Devices]
      summary: Delete a device without retained backups
      description: Requires `devices.manage`.
      responses:
        '204': {description: Device deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/test-connection:
    post:
      tags: [Devices]
      summary: Test the registered connector
      description: Requires `devices.manage`. No user-supplied command is accepted.
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
        '504': {$ref: '#/components/responses/Timeout'}
  /api/v1/devices/{deviceID}/config/running:
    get:
      tags: [Configuration]
      summary: Read the running configuration
      description: Requires `configs.read`. `refresh=true` additionally requires `devices.manage`.
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Refresh'}]
      responses:
        '200': {$ref: '#/components/responses/ConfigResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
        '504': {$ref: '#/components/responses/Timeout'}
  /api/v1/devices/{deviceID}/config/startup:
    get:
      tags: [Configuration]
      summary: Read the startup configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Refresh'}]
      responses:
        '200': {$ref: '#/components/responses/ConfigResponse'}
        '502': {$ref: '#/components/responses/DeviceFailure'}
  /api/v1/devices/{deviceID}/config/running/download:
    get:
      tags: [Configuration]
      summary: Download the running configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200':
          description: Configuration text
          content: {text/plain: {schema: {type: string}}}
  /api/v1/devices/{deviceID}/config/startup/download:
    get:
      tags: [Configuration]
      summary: Download the startup configuration
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200':
          description: Configuration text
          content: {text/plain: {schema: {type: string}}}
  /api/v1/devices/{deviceID}/facts:
    get:
      tags: [Configuration]
      summary: Read device facts
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/devices/{deviceID}/interfaces:
    get:
      tags: [Configuration]
      summary: Read interface status
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/devices/{deviceID}/backups:
    get:
      tags: [Backups]
      summary: List configuration backups
      description: Requires `backups.read`.
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
    post:
      tags: [Backups]
      summary: Create a manual configuration backup
      description: Requires `backups.create`. Identical content is deduplicated.
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config_type: {type: string, enum: [running, startup], default: running}
      responses:
        '201': {$ref: '#/components/responses/DataResponse'}
        '200': {description: Existing identical backup, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /api/v1/devices/{deviceID}/backups/{backupID}:
    get:
      tags: [Backups]
      summary: Get backup metadata and content
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/BackupID'}]
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/backups/{backupID}/download:
    get:
      tags: [Backups]
      summary: Download a retained backup
      parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/BackupID'}]
      responses:
        '200': {description: Configuration text, content: {text/plain: {schema: {type: string}}}}
  /api/v1/devices/{deviceID}/backups/{leftID}/diff/{rightID}:
    get:
      tags: [Backups]
      summary: Compare two backups
      parameters:
        - {$ref: '#/components/parameters/DeviceID'}
        - {name: leftID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: rightID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit records
      description: Requires `audit.read`. Audit records never contain credentials or configuration content.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
  /api/v1/audit-logs/{auditID}:
    get:
      tags: [Audit]
      summary: Get an audit record
      parameters:
        - {name: auditID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/DataResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-authorizations:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      summary: List device-scoped authorization requests
      description: Requires devices.read + changes.authorization.read and device-group access.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, revoked]}}
        - {name: config_type, in: query, schema: {type: string, enum: [running, startup]}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationListResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Register an explicit scoped authorization request
      description: >-
        Requires devices.read + changes.authorization.request and device-group access.
        Device comes only from the route. Actor and lifecycle timestamps come from the server.
        Reference is trimmed and uppercased and unique case-insensitively.
        Categories are trimmed/lowercased, distinct, known version-one categories, and stored sorted.
        No edits are available; changed scope requires a new request.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangeAuthorizationCreate'}}}
      responses:
        '201': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    get:
      summary: Inspect an authorization request
      description: Requires devices.read + changes.authorization.read and device-group access. Cross-device IDs return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/approve:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Independently approve a pending request
      description: >-
        Requires devices.read + changes.authorization.approve and device-group access.
        Only pending -> approved, before window_end. Active approver must differ from requester,
        including system administrators. Server UTC time and authenticated actor are recorded.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/reject:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Reject a pending request
      description: Requires devices.read + changes.authorization.approve and device-group access. Only pending -> rejected; terminal and immutable decision.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/revoke:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    post:
      summary: Revoke an approved request
      description: >-
        Requires devices.read + changes.authorization.approve and device-group access.
        Only approved -> revoked; terminal. New links are prohibited. Prior valid links and
        event authorization remain intact as-of the recorded historical decision. Policy is unchanged.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationAction'}}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-authorizations/{authorizationID}/history:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/AuthorizationID'}]
    get:
      summary: Read immutable authorization history
      description: Requires devices.read + changes.authorization.read and device-group access. Append-only; no edit/delete endpoint or raw configuration payload.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ChangeAuthorizationHistoryResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events:
    parameters: [{$ref: '#/components/parameters/DeviceID'}]
    get:
      summary: Inspect device change events without backup contents
      description: Requires devices.read + backups.read and device-group access. No automatic authorization or policy evaluation occurs.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: config_type, in: query, schema: {type: string, enum: [running, startup]}}
        - {name: authorization_status, in: query, schema: {type: string, enum: [unaccounted, authorized]}}
        - {name: policy_status, in: query, schema: {type: string, enum: [not_evaluated, pass, violation]}}
      responses:
        '200': {$ref: '#/components/responses/ChangeEventListResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect a scoped change event
      description: Requires devices.read + backups.read and device-group access. Cross-device IDs return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeEventResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/items:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect sanitized classified change items
      description: Requires devices.read + backups.read and device-group access. Ordinal ascending; only sanitized Command/ContextPath, never raw backup or diff.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {$ref: '#/components/responses/ChangeEventItemsResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/authorize:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    post:
      summary: Explicitly attest and reconcile one observed change event
      description: >-
        Requires devices.read + backups.read + changes.authorization.reconcile and device-group access.
        Active reviewer must differ from requester; independent approver may reconcile.
        Request must currently be approved with independent approval issued at or before DetectedAt.
        Event must be unaccounted, match device/config type, have a valid snapshot chain,
        analysis version 1 and nonzero items with matching count. Every item must have valid
        classification version 1 and an explicitly allowed category. Other is not a wildcard;
        subcategory unclassified is not a wildcard. Inclusive window_start <= DetectedAt < exclusive window_end.
        One request links at most one event and one event links at most one request.
        Duplicate attempts conflict. Link, event status/UpdatedAt and history commit atomically.
        DetectedAt is Aegis observation time, not exact physical device command execution time.
        This is a human attestation supported by checks, not cryptographic proof. No partial authorization.
        Legacy/zero-item events cannot be authorized. PolicyStatus is untouched.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangeEventAuthorize'}}}
      responses:
        '200': {$ref: '#/components/responses/ChangeEventAuthorizationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/devices/{deviceID}/change-events/{eventID}/authorization:
    parameters: [{$ref: '#/components/parameters/DeviceID'}, {$ref: '#/components/parameters/EventID'}]
    get:
      summary: Inspect recorded event-to-ticket authorization evidence
      description: Requires devices.read + changes.authorization.read and device-group access. Historical evidence survives later revocation; unlinked events return 404.
      responses:
        '200': {$ref: '#/components/responses/ChangeEventAuthorizationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    DeviceID: {name: deviceID, in: path, required: true, schema: {type: string, format: uuid}}
    CredentialID: {name: credentialID, in: path, required: true, schema: {type: string, format: uuid}}
    BackupID: {name: backupID, in: path, required: true, schema: {type: string, format: uuid}}
    AuthorizationID: {name: authorizationID, in: path, required: true, schema: {type: string, format: uuid}}
    EventID: {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Refresh: {name: refresh, in: query, schema: {type: boolean, default: false}}
  schemas:
    ChangeAuthorizationCreate:
      type: object
      additionalProperties: false
      required: [reference, config_type, allowed_categories, window_start, window_end]
      properties:
        reference: {type: string, description: 'Trimmed/uppercase normalized ASCII letters, digits, dots, underscores, colons and hyphens; normalized length 3-64. No secrets or raw configuration.'}
        config_type: {type: string, enum: [running, startup]}
        allowed_categories:
          type: array
          minItems: 1
          maxItems: 13
          uniqueItems: true
          description: Normalized lowercase/trimmed, no duplicates after normalization. Other must be explicitly included; unclassified is forbidden.
          items: {$ref: '#/components/schemas/ChangeAuthorizationCategory'}
        window_start: {type: string, format: date-time, description: 'Explicit RFC3339 timezone required; normalized UTC, inclusive start.'}
        window_end: {type: string, format: date-time, description: 'Explicit RFC3339 timezone required; normalized UTC, exclusive end. Start < end, maximum duration 24 hours. End must be after server time at creation/approval.'}
    ChangeAuthorizationCategory:
      type: string
      enum: [system, interface, switching, routing, access_control, aaa, management, monitoring, services, crypto_vpn, qos, redundancy, other]
    AuthorizationAction:
      type: object
      additionalProperties: false
      description: Empty object or no body. Client actor/timestamp fields are rejected.
    ChangeEventAuthorize:
      type: object
      additionalProperties: false
      required: [authorization_id, attestation]
      properties:
        authorization_id: {type: string, format: uuid}
        attestation: {type: string, enum: [reviewed_change_items_against_ticket]}
    ChangeAuthorization:
      type: object
      required: [id, reference, device_id, config_type, allowed_categories, window_start, window_end, status, requested_by, requested_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z0-9._:-]+$'}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        allowed_categories: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorizationCategory'}, minItems: 1, maxItems: 13, uniqueItems: true}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        status: {type: string, enum: [pending, approved, rejected, revoked]}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
        rejected_by: {type: string, format: uuid}
        rejected_at: {type: string, format: date-time}
        revoked_by: {type: string, format: uuid}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChangeEventAuthorization:
      type: object
      required: [event_id, authorization_id, linked_by, linked_at, attestation]
      properties:
        event_id: {type: string, format: uuid}
        authorization_id: {type: string, format: uuid}
        linked_by: {type: string, format: uuid}
        linked_at: {type: string, format: date-time}
        attestation: {type: string, enum: [reviewed_change_items_against_ticket]}
    ChangeAuthorizationHistory:
      type: object
      required: [id, authorization_id, action, actor_user_id, occurred_at]
      properties:
        id: {type: string, format: uuid}
        authorization_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        action: {type: string, enum: [requested, approved, rejected, revoked, linked]}
        actor_user_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    ChangeEvent:
      type: object
      required: [id, device_id, config_type, from_backup_id, to_backup_id, detected_at, added_lines, removed_lines, authorization_status, policy_status, created_at, updated_at, analysis_version, item_count]
      properties:
        id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        config_type: {type: string, enum: [running, startup]}
        from_backup_id: {type: string, format: uuid}
        to_backup_id: {type: string, format: uuid}
        detected_at: {type: string, format: date-time, description: 'Aegis observation timestamp, not exact device command execution time.'}
        added_lines: {type: integer, minimum: 0}
        removed_lines: {type: integer, minimum: 0}
        authorization_status: {type: string, enum: [unaccounted, authorized]}
        policy_status: {type: string, enum: [not_evaluated, pass, violation]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        analysis_version: {type: integer, minimum: 0}
        analyzed_at: {type: string, format: date-time}
        item_count: {type: integer, minimum: 0}
    ChangeEventItem:
      type: object
      required: [id, change_event_id, ordinal, operation, context_path, command, sensitive, created_at, classification_version, category, subcategory, classification_rule]
      properties:
        id: {type: string, format: uuid}
        change_event_id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 0}
        operation: {type: string, enum: [add, remove]}
        context_path: {type: array, items: {type: string}, description: Sanitized context only.}
        command: {type: string, description: Sanitized command only.}
        sensitive: {type: boolean}
        created_at: {type: string, format: date-time}
        classification_version: {type: integer, minimum: 0}
        category: {type: string}
        subcategory: {type: string}
        classification_rule: {type: string}
        classified_at: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    TokenSet:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [name, auth_type, username]
      properties:
        name: {type: string}
        auth_type: {type: string, enum: [password, private_key]}
        username: {type: string}
        password: {type: string, format: password}
        private_key: {type: string, writeOnly: true}
        enable_secret: {type: string, format: password, writeOnly: true}
    DeviceWrite:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, maxLength: 200}
        hostname: {type: string, maxLength: 253}
        management_ip: {type: string, format: ip}
        management_port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        vendor: {type: string, enum: [cisco]}
        platform: {type: string, enum: [ios, ios-xe]}
        protocol: {type: string, enum: [ssh]}
        credential_id: {type: string, format: uuid}
        device_group: {type: string}
        description: {type: string}
        enabled: {type: boolean}
    DeviceCreate:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          required: [display_name, management_ip, vendor, platform, protocol, credential_id]
    DevicePatch:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          minProperties: 1
    Device:
      allOf:
        - {$ref: '#/components/schemas/DeviceWrite'}
        - type: object
          required: [id, display_name, management_ip, management_port, vendor, platform, protocol, enabled, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            last_success_at: {type: string, format: date-time}
            last_failure_at: {type: string, format: date-time}
            last_error_code: {type: string}
    ConfigResult:
      type: object
      required: [device_id, vendor, platform, protocol, configuration_type, retrieved_at, from_cache, content_hash, config]
      properties:
        device_id: {type: string, format: uuid}
        hostname: {type: string}
        vendor: {type: string}
        platform: {type: string}
        protocol: {type: string}
        configuration_type: {type: string, enum: [running, startup]}
        retrieved_at: {type: string, format: date-time}
        from_cache: {type: boolean}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        config: {type: string}
    DataEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, format: uuid}
        pagination:
          type: object
          properties: {limit: {type: integer}, offset: {type: integer}, total: {type: integer}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: DEVICE_CONNECTION_FAILED}
            message: {type: string}
            request_id: {type: string, format: uuid}
  responses:
    ChangeAuthorizationResponse: {description: Scoped authorization request, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeAuthorization'}}}]}}}}
    ChangeAuthorizationListResponse: {description: Paginated scoped authorization requests, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorization'}}}}]}}}}
    ChangeEventResponse: {description: Scoped change event without raw configuration, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeEvent'}}}]}}}}
    ChangeEventListResponse: {description: Paginated scoped change events, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeEvent'}}}}]}}}}
    ChangeEventItemsResponse: {description: Paginated sanitized items in ordinal order, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeEventItem'}}}}]}}}}
    ChangeEventAuthorizationResponse: {description: Immutable recorded authorization link, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ChangeEventAuthorization'}}}]}}}}
    ChangeAuthorizationHistoryResponse: {description: Paginated append-only history ordered by action time then insertion order, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ChangeAuthorizationHistory'}}}}]}}}}
    DataResponse: {description: Successful response, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    ListResponse: {description: Paginated response, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    DeviceResponse: {description: Device, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Device'}}}]}}}}
    ConfigResponse: {description: Configuration, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/DataEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ConfigResult'}}}]}}}}
    AuthResponse: {description: Tokens issued, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationFailed: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    DeviceFailure: {description: Safe connector failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Timeout: {description: Device operation timed out, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
